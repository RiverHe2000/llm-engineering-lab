# CPU smoke-test configuration (~1 minute). Exercises the whole pipeline end to end.
model:
  vocab_size: 1024
  d_model: 128
  n_layers: 4
  n_heads: 4
  n_kv_heads: 2
  max_seq_len: 128
  dropout: 0.0

train:
  out_dir: runs/tiny
  batch_size: 16
  block_size: 128
  grad_accum_steps: 1
  max_steps: 200
  lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 20
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 50
  eval_iters: 10
  checkpoint_interval: 100
  log_interval: 10
  precision: fp32
  device: cpu
  seed: 1337

data:
  tokenizer: artifacts/tokenizer_1024.json
  train_bin: data/tinyshakespeare/train.bin
  val_bin: data/tinyshakespeare/val.bin
