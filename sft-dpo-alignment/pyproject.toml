[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sftdpo"
version = "0.1.0"
description = "Supervised fine-tuning then Direct Preference Optimisation of a small instruct model on a schema-constrained extraction task, with the preference signal produced by a deterministic verifier instead of human labels."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chuan He" }]
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "peft>=0.13",
  "accelerate>=1.0",
  "pydantic>=2.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
# The official TRL implementation, used only to cross-check my DPO loss.
crosscheck = ["trl>=0.11"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.16.6",       # pinned: a lint gate must not drift with the tool
  "mypy==2.3.1",
  "hypothesis>=6.100",
]

[project.scripts]
sftdpo = "sftdpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sftdpo = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "PIE", "RET", "ARG"]
ignore = ["RUF012", "N812", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "PT011", "PT018", "E501", "RUF001", "SLF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "torch.*",
  "transformers.*",
  "peft.*",
  "trl.*",
  "accelerate.*",
  "huggingface_hub.*",
  "tokenizers.*",
  "datasets.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=sftdpo --cov-report=term-missing"
markers = [
  "slow: long-running tests",
  "gpu: requires a CUDA device",
  "network: downloads models (skipped in CI)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
branch = true
source = ["sftdpo"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
