name: CI · transformer-from-scratch

on:
  push:
    branches: [main]
    paths: ["transformer-from-scratch/**", ".github/workflows/transformer-from-scratch-ci.yml"]
  pull_request:
    paths: ["transformer-from-scratch/**", ".github/workflows/transformer-from-scratch-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: transformer-from-scratch

jobs:
  quality:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: transformer-from-scratch/pyproject.toml

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy

      - name: Test (pytest + coverage)
        run: pytest --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: transformer-from-scratch/coverage.xml
          if-no-files-found: ignore
