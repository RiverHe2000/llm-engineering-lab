[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loraeval"
version = "0.1.0"
description = "LoRA implemented from scratch + a statistically rigorous evaluation harness, applied to financial sentiment classification (Financial PhraseBank)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chuan He" }]
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "huggingface-hub>=0.24",
  "safetensors>=0.4",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.16.6",       # pinned: a lint gate must not drift with the tool
  "mypy==2.3.1",
  "types-PyYAML",
  "types-tqdm",
  "matplotlib>=3.9",
]

[project.scripts]
loraeval = "loraeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "PIE", "RET", "ARG"]
ignore = ["RUF012", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "PT011", "PT018", "E501", "RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# Third-party ML libraries ship incomplete type information; treat them as opaque.
module = ["transformers.*", "huggingface_hub.*", "tokenizers.*", "safetensors.*", "matplotlib.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=loraeval --cov-report=term-missing"
markers = [
  "slow: long-running tests (deselect with -m 'not slow')",
  "gpu: requires a CUDA device",
  "network: downloads models or data (skipped in CI)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning:torch.*"]

[tool.coverage.run]
branch = true
source = ["loraeval"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
